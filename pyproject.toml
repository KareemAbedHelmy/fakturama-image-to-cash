[build-system]
requires = ["setuptools>=70,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "fakturama-image-to-cash"
version = "0.1.0"
description = "Guarded Order-first Fakturama automation core and Windows inspection tooling"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5", "Pillow==12.3.0"]

[project.optional-dependencies]
windows = ["pywinauto==0.6.9; sys_platform == 'win32'"]

[project.scripts]
fakturama-flow = "fakturama_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
